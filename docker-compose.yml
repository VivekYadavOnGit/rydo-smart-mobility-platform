version: '3.9'

services:
  postgres:
    image: postgres:16
    container_name: rydo-postgres
    restart: always
    environment:
      POSTGRES_USER: rydo
      POSTGRES_PASSWORD: rydo123
      POSTGRES_DB: auth_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rydo-network

  redis:
    image: redis:7
    container_name: rydo-redis
    restart: always
    ports:
      - "6379:6379"
    networks:
      - rydo-network

  kafka:
    image: apache/kafka:latest
    container_name: rydo-kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - rydo-network

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: rydo-kafka-ui
    restart: always
    ports:
      - "8085:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: rydo-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka
    networks:
      - rydo-network

volumes:
  postgres_data:

networks:
  rydo-network:
    driver: bridge
